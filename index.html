<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Программа Гибуша 2026</title>
<meta name="description" content="Программа Гибуша 2026 · 27–29 ноября, Юрмала">
<meta name="theme-color" content="#0F94FD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: brand-blue masthead with the poster's slanted cut, sticky day/hall bar, then a time rail (time | parallel sessions). */
:root{
  --blue:#0F94FD; --red:#FE1A4D; --white:#FFFFFF;
  --bg:#EDF3FA; --surface:#FFFFFF; --ink:#0A1424; --muted:#56667C; --line:#D5E1EE;
  --tint:#DDEEFF; --tint-line:#B7DAFF; --chip:#E0EAF5;
  --h0:#0F94FD; --h1:#FE1A4D; --h2:#0A1424;
  --h0t:#0A6FD1; --h1t:#D8113E; --h2t:#0A1424;
  --font:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06101D; --surface:#0E1B2C; --ink:#EAF2FB; --muted:#93A5BB; --line:#1D2F46;
    --tint:#0C2A4C; --tint-line:#17457A; --chip:#15263B;
    --h2:#EAF2FB; --h0t:#5CB6FF; --h1t:#FF6886; --h2t:#EAF2FB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06101D; --surface:#0E1B2C; --ink:#EAF2FB; --muted:#93A5BB; --line:#1D2F46;
  --tint:#0C2A4C; --tint-line:#17457A; --chip:#15263B;
  --h2:#EAF2FB; --h0t:#5CB6FF; --h1t:#FF6886; --h2t:#EAF2FB;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Masthead */
.top{background:var(--blue);color:var(--white);padding-top:env(safe-area-inset-top,0px);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),58% 100%,0 calc(100% - 16px))}
.top .wrap{padding-block:20px 50px;display:grid;gap:18px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{width:min(46vw,190px);height:auto;display:block}
.when{text-align:right;font-size:clamp(15px,4.4vw,20px);line-height:1.1;font-weight:400;letter-spacing:.01em}
.status{font-size:clamp(20px,5.6vw,26px);font-weight:800;line-height:1.15;text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance}
.status small{display:block;font-size:14px;font-weight:500;text-transform:none;opacity:.88;margin-top:4px;letter-spacing:0}

/* News */
#news{display:grid;gap:8px;margin-top:-6px}
.news{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:3px}
.news.hot{background:var(--red);border-color:var(--red);color:var(--white)}
.news-when{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--h0t);display:flex;gap:8px;align-items:center}
.news.hot .news-when{color:var(--white);opacity:.9}
.news-text{font-weight:600;white-space:pre-line}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.news.hot .dot{background:var(--white)}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--h0t);font-weight:600;font-size:14px;justify-self:start}

/* Sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:10px;border-bottom:1px solid var(--line)}
.bar .wrap{display:grid;gap:10px}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;justify-content:center;align-items:baseline;gap:6px;line-height:1.1;position:relative}
.day b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.day span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.day[aria-pressed="true"] span{color:var(--white);opacity:.9}
.day .today{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.day[aria-pressed="true"] .today{background:var(--white)}
.tracks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tracks::-webkit-scrollbar{display:none}
.trk{flex:none;border:1.5px solid var(--blue);background:transparent;color:var(--h0t);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;white-space:nowrap}
.trk[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.place{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.place::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box}
.mark{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#0A1424;border-radius:4px;padding:2px 6px;white-space:nowrap}
.legend{display:grid;gap:6px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.legend h4{margin:0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend div{display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:1.35}
.legend .mark{flex:none}
.tools{display:flex;gap:8px;align-items:center;min-width:0}
.halls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:1px}
.halls::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sq{width:9px;height:9px;flex:none;display:inline-block;transform:rotate(8deg)}
.searchbtn{flex:none;width:36px;height:34px;border-radius:999px;border:0;background:var(--chip);display:grid;place-items:center}
.searchbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.theme-note{font-size:13px;color:var(--muted);line-height:1.35}
.theme-note b{color:var(--ink);font-weight:600}

/* Now block */
#now{margin-top:14px}
.nowbox{background:var(--surface);border:2px solid var(--red);border-radius:16px;padding:12px 14px 6px;display:grid;gap:4px}
.nowbox.next{border-color:var(--line);border-width:1px}
.nowhead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--h1t)}
.nowbox.next .nowhead{color:var(--h0t)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(254,26,77,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(254,26,77,0)}100%{box-shadow:0 0 0 0 rgba(254,26,77,0)}}
.nowitem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;width:100%}
.nowitem:first-of-type{border-top:0}
.nowitem .hl{grid-row:span 2}
.nowitem .t{font-weight:700;line-height:1.3;min-width:0}
.nowitem .s{font-size:13px;color:var(--muted);min-width:0}
.nowitem .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nowgrid{display:grid;gap:10px}

/* Timeline */
#list{padding-block:6px 10px}
.pastbtn{width:100%;margin-top:12px;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;font-size:14px;font-weight:600;color:var(--muted)}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding-block:14px;border-top:1px solid var(--line);scroll-margin-top:var(--barh,140px)}
.slot:first-child{border-top:0}
.slot-time{display:grid;align-content:start;gap:2px;font-variant-numeric:tabular-nums;padding-top:2px}
.slot-time b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.slot-time span{font-size:12px;color:var(--muted);font-weight:500}
.slot-time .live{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--white);background:var(--red);border-radius:4px;padding:2px 4px;justify-self:start;margin-top:4px}
.slot.past{opacity:.5}
.items{display:grid;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:3px;min-width:0;text-align:left;width:100%}
button.card{cursor:pointer}
.card-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;min-height:16px;min-width:0}
.card-top .tags{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.hl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.speaker{font-size:13px;font-weight:500;color:var(--muted);overflow-wrap:anywhere}
.title{font-size:16px;line-height:1.3;font-weight:700;margin:0;overflow-wrap:anywhere;text-wrap:pretty}
.note{font-size:13px;font-weight:600;color:var(--h1t)}
.desc{font-size:14px;line-height:1.5;color:var(--ink);margin-top:6px;padding-top:8px;border-top:1px solid var(--line);white-space:pre-line}
.more{font-size:13px;font-weight:600;color:var(--h0t);margin-top:2px}
.badge{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--red);color:var(--white);border-radius:4px;padding:2px 5px;white-space:nowrap}
.card.common{background:var(--tint);border-color:var(--tint-line)}
.card.common .title{font-weight:800}
.card.brk{background:transparent;border-style:dashed}
.card.brk .title{font-weight:500;font-size:15px;color:var(--muted)}
.cmt{font-size:13px;font-style:italic;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.cmt::before{content:'\2721\FE0E';font-style:normal;opacity:.7}
.empty{padding:28px 4px;color:var(--muted);text-align:center}
.dayhead{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 0 4px}

/* Footer + toast */
footer{padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px;display:grid;gap:8px;border-top:1px solid var(--line);margin-top:8px}
footer .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.refresh{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.offline{color:var(--h1t);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--blue);font-weight:700;padding:0}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}html{scroll-behavior:auto}}
@media (min-width:560px){.slot{grid-template-columns:64px minmax(0,1fr)}.items.multi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
</style>
</head>

/* ---------- CSV ---------- */
function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

const TIME_RE = /^\s*(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})/;
const DAY_RE = /(пятн|субб|шаб|воскр|понед|вторн|сред|четв)[^\d]{0,12}(\d{1,2})[.\/](\d{1,2})/i;
const BREAK_RE = /^(завтрак|обед|ужин|coffee|кофе)/i;

const normHall = s => s.replace(/\s+/g, ' ').trim();

function parseProgram(rows) {
  const days = []; const hallMap = new Map(); let halls = null, day = null, hallRow = -9;
  rows.forEach((r, i) => {
    const cells = r.map(c => (c || '').trim());
    const a = cells[0] || '';
    if (/^зал/i.test(a)) {
      halls = [];
      cells.forEach((c, j) => { if (j > 0 && c) { const name = normHall(c); if (!hallMap.has(name)) hallMap.set(name, { name, theme: '', idx: hallMap.size }); halls.push({ col: j, name }); } });
      hallRow = i; return;
    }
    const tm = a.match(TIME_RE);
    if (!tm) {
      if (halls && i === hallRow + 1 && !a) { halls.forEach(h => { if (cells[h.col] && !hallMap.get(h.name).theme) hallMap.get(h.name).theme = cells[h.col]; }); return; }
      const txt = cells.filter(Boolean).join(' ');
      const dm = !a && txt.match(DAY_RE);
      if (dm) {
        const d = +dm[2], m = +dm[3];
        day = { d, m, label: txt, num: Date.UTC(CONFIG.year, m - 1, d) / 864e5, items: [] };
        day.wd = new Date(Date.UTC(CONFIG.year, m - 1, d)).getUTCDay();
        days.push(day);
      }
      return;
    }
    if (!day || !halls || !halls.length) return;
    const start = +tm[1] * 60 + +tm[2]; let end = +tm[3] * 60 + +tm[4];
    if (end <= start) end += 1440;
    const filled = halls.map(h => ({ h, text: cells[h.col] })).filter(x => x.text);
    if (!filled.length) return;
    const common = filled.length === 1 && filled[0].h === halls[0];
    filled.forEach(({ h, text }) => {
      const hall = common ? null : h.name;
      day.items.push(makeItem(day, start, end, hall, text));
    });
  });
  days.forEach(d => d.items.sort((x, y) => x.start - y.start || hallIdx(x) - hallIdx(y)));
  function hallIdx(it) { return it.hall ? hallMap.get(it.hall).idx : -1; }
  state.halls = [...hallMap.values()];
  return days.filter(d => d.items.length);
}

function cleanTitle(s) {
  const close = { '«': '»', '"': '"', '“': '”', '„': '“' }[s[0]];
  if (!close) return s;
  const i = s.indexOf(close, 1);
  if (i === s.length - 1) return s.slice(1, -1).trim();
  if (s[0] === '"' && (s.match(/"/g) || []).length % 2) return s.replace(/"/g, '').trim();
  return s;
}

  bindCards();
}
function bindCards() {
  document.querySelectorAll('#list button.card').forEach(b => b.onclick = () => {
    const k = b.dataset.key; state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderList();
  });
}
function renderNow() {
  const el = $('#now'); const now = nowInfo();
  const all = state.days.flatMap(d => itemsFor(d));
  const live = all.filter(it => absStart(it) <= now.abs && now.abs < absEnd(it) && !(it.brk && all.some(o => o !== it && !o.brk && absStart(o) <= now.abs && now.abs < absEnd(o))));
  const upcoming = all.filter(it => absStart(it) > now.abs);
  const nextStart = upcoming.length ? Math.min(...upcoming.map(absStart)) : null;
  // показываем блок только во время Гибуша (или за 3 часа до начала)
  if (!all.length || (!live.length && (nextStart === null || nextStart - now.abs > 180))) { el.innerHTML = ''; return; }
  const next = nextStart !== null && nextStart - now.abs <= 180 ? upcoming.filter(it => absStart(it) === nextStart) : [];
  const row = (it, showEnd) => `<button class="nowitem" data-go="${it.day.num}-${it.start}">${it.hall ? hallLabel(it.hall) : it.own && !it.common ? `<span class="place">${esc(it.place || trackName())}</span>` : '<span class="hl" style="color:var(--muted)">Для всех</span>'}<span class="t">${esc(it.title)}</span><span class="s">${markFor(it) ? markFor(it) + ' ' : ''}${it.speaker ? esc(it.speaker) + ' · ' : ''}<span class="tm">${showEnd ? 'до ' + fmt(it.end) : fmt(it.start) + '–' + fmt(it.end)}</span></span></button>`;
  let html = '<div class="nowgrid">';
  if (live.length) html += `<div class="nowbox"><div class="nowhead"><span class="pulse"></span>Сейчас идёт</div>${live.map(it => row(it, true)).join('')}</div>`;
  if (next.length) {
    const mins = nextStart - now.abs;
    html += `<div class="nowbox next"><div class="nowhead">Далее в ${fmt(nextStart % 1440)} · через ${mins} мин</div>${next.map(it => row(it, false)).join('')}</div>`;
  }
  el.innerHTML = html + '</div>';
  el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const [dn] = b.dataset.go.split('-'); state.sel = +dn; state.showPast = true; state.hall = 'all';
    if (state.searching) closeSearch();
    renderDays(); renderHalls(); renderList();
    const t = document.getElementById('s-' + b.dataset.go); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
function renderFooter() {
  const t = state.updated ? new Date(state.updated) : null;
  const time = t ? t.toLocaleString('ru-RU', { timeZone: CONFIG.tz, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('#updated').innerHTML = state.offline
    ? `<span class="offline">Нет связи с таблицей.</span> Показана версия от ${esc(time)}`
    : `Обновлено ${esc(time)}`;
}
let toastTimer;
function toast(msg) {
  $('#toasttext').textContent = msg; $('#toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').hidden = true, 7000);
}
$('#toastok').onclick = () => $('#toast').hidden = true;

/* ---------- Поиск ---------- */
function closeSearch() { state.searching = false; state.q = ''; $('#q').value = ''; $('#searchrow').hidden = true; $('#searchbtn').setAttribute('aria-pressed', 'false'); }
$('#searchbtn').onclick = () => {
  if (state.searching) { closeSearch(); renderDays(); renderList(); return; }
  state.searching = true; $('#searchrow').hidden = false; $('#searchbtn').setAttribute('aria-pressed', 'true'); $('#q').focus(); renderDays();
};
$('#q').oninput = e => { state.q = e.target.value; renderList(); };
$('#refresh').onclick = () => load();

/* ---------- Старт ---------- */
(function init() {
  state.wantTrack = location.hash.slice(1) || store('gib-track') || 'adults';
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'adults'; if (state.tracks.some(t => t.id === id)) setTrack(id); });
  const cached = store('gib-cache');
  apply(cached || { p: SNAPSHOT, n: '', i: '', y: SNAPSHOT_TRACKS, t: SNAPSHOT_TIME }, false, !cached);
  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, CONFIG.refreshMs);
  setInterval(() => { renderStatus(); renderNow(); renderList(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
})();
</script>
</body>
</html>
